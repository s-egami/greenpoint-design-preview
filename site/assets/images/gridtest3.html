<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
.filler{height:1200px;background:#eee;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;max-width:1368px;margin:20px auto;}
.card{background:#fff;border-radius:4px;overflow:hidden;}
.card .ph{padding-top:100%;position:relative;background-size:cover;background-position:center;}
.card .ph.img-food{background-image:url('food.jpg');}
.card .ph.img-alcohol{background-image:url('alcohol.jpg');}
.card .ph.img-leather{background-image:url('leather-fashion.jpg');}
.card .ph.img-lifestyle{background-image:url('lifestyle-interior.jpg');}
</style></head>
<body>
<div class="filler"></div>
<div class="grid">
<div class="card"><div class="ph img-food"></div></div>
<div class="card"><div class="ph img-alcohol"></div></div>
<div class="card"><div class="ph img-leather"></div></div>
<div class="card"><div class="ph img-lifestyle"></div></div>
</div>
</body></html>
